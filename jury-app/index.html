<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shared Ground | Jury Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <a href="/" class="logo-mark login-card__logo" aria-label="OMIC">
        <span class="logo-mark__circle">O</span>
        <span class="logo-mark__circle">M</span>
        <span class="logo-mark__circle">I</span>
        <span class="logo-mark__circle">C</span>
      </a>
      <h1 class="login-card__title">Shared Ground</h1>
      <p class="login-card__sub">OMIC Art Prize 2026 — Jury &amp; Scoring</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" name="loginUsername" autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" />
        </div>
        <p class="error-message" id="loginError"></p>
        <button type="submit" id="loginSubmit" class="btn btn--primary btn--block">Sign In</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
