<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shared Ground | Jury Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <div class="app-shell">
    <header class="app-topbar">
      <a href="/" class="logo-mark logo-mark--small" aria-label="OMIC">
        <span class="logo-mark__circle">O</span>
        <span class="logo-mark__circle">M</span>
        <span class="logo-mark__circle">I</span>
        <span class="logo-mark__circle">C</span>
      </a>
      <p class="app-topbar__title">Shared Ground — Jury Review</p>
      <span class="app-topbar__name" id="jurorName"></span>
      <button type="button" id="logoutBtn" class="btn btn--secondary">Log out</button>
    </header>

    <main class="app-main">

      <div id="statusBarWrap"></div>

      <div class="juror-tabs" role="tablist">
        <button type="button" class="juror-tab is-active" id="tabBtnPending" data-tab="pending">
          Yet to Evaluate <span class="juror-tab__count" id="countPending">—</span>
        </button>
        <button type="button" class="juror-tab" id="tabBtnLoved" data-tab="loved">
          Loved <span class="juror-tab__count" id="countLoved">—</span>
        </button>
        <button type="button" class="juror-tab" id="tabBtnRejected" data-tab="rejected">
          Rejected <span class="juror-tab__count" id="countRejected">—</span>
        </button>
        <button type="button" class="juror-tab" id="tabBtnSavedForLater" data-tab="savedForLater">
          Save for Later <span class="juror-tab__count" id="countSavedForLater">—</span>
        </button>
        <button type="button" class="juror-tab" id="tabBtnSkipped" data-tab="skipped">
          Skipped <span class="juror-tab__count" id="countSkipped">—</span>
        </button>
        <button type="button" class="juror-tab" id="tabBtnAll" data-tab="all">
          All Artwork <span class="juror-tab__count" id="countAll">—</span>
        </button>
      </div>

      <section class="juror-panel" id="panelPending"></section>
      <section class="juror-panel" id="panelLoved" hidden></section>
      <section class="juror-panel" id="panelRejected" hidden></section>
      <section class="juror-panel" id="panelSavedForLater" hidden></section>
      <section class="juror-panel" id="panelSkipped" hidden></section>
      <section class="juror-panel" id="panelAll" hidden></section>

    </main>
  </div>

  <!-- Zoom overlay -->
  <div class="zoom-overlay" id="zoomOverlay" hidden>
    <button type="button" class="zoom-close" id="zoomCloseBtn" aria-label="Close zoom">&times;</button>
    <img id="zoomImage" src="" alt="" />
    <div class="zoom-controls">
      <button type="button" id="zoomOutBtn" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zoomResetBtn" aria-label="Reset zoom">&#8634;</button>
      <button type="button" id="zoomInBtn" aria-label="Zoom in">+</button>
    </div>
  </div>

  <!-- Compare overlay -->
  <div class="modal-overlay" id="compareOverlay" hidden>
    <div class="modal-card compare-card">
      <button type="button" class="zoom-close compare-card__close" id="compareCloseBtn" aria-label="Close compare">&times;</button>
      <div id="compareContent"></div>
    </div>
  </div>

  <script type="module" src="/js/juror.js"></script>
</body>
</html>
