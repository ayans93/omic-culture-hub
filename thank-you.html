  <title>Thank You | OMIC Cultural Hub</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-544K83CL"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo-mark" aria-label="OMIC — Home">
        <span class="logo-mark__circle">O</span>
        <span class="logo-mark__circle">M</span>
        <span class="logo-mark__circle">I</span>
        <span class="logo-mark__circle">C</span>
        <span class="logo-mark__suffix" aria-hidden="true">
          <span>ulture</span>
          <span>afe</span>
          <span>inema</span>
        </span>
      </a>

      <nav class="nav-pills" aria-label="Site navigation">
        <a href="index.html" class="nav-pill">Home</a>
        <a href="events.html" class="nav-pill">Cultural Hub</a>
        <a href="cafe.html" class="nav-pill">Cafe</a>
        <a href="shows.html" class="nav-pill">Shows</a>
      </nav>

    </div>
  </header>

  <main class="page-content">
    <div class="thank-you">
      <div class="success-icon">&#10003;</div>
      <h1 class="title" id="thankYouTitle">Thank you!</h1>
      <p class="thank-you__desc" id="thankYouDesc">
        Your submission has been received. We'll be in touch with the details soon.
      </p>
      <div class="thank-you__actions">
        <a class="btn btn--primary" href="events.html">Explore more events</a>
        <a class="btn btn--secondary" href="index.html">Go to homepage</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__note">&copy; 2026 OMIC Cultural Hub. All events subject to change.</p>
      <nav class="site-footer__links" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="events.html">Cultural Hub</a>
        <a href="cafe.html">Cafe</a>
        <a href="shows.html">Shows</a>
      </nav>
    </div>
  </footer>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var eventName = params.get('event');
      var type = params.get('type');
      var titleEl = document.getElementById('thankYouTitle');
      var descEl = document.getElementById('thankYouDesc');

      if (type === 'submission') {
        titleEl.textContent = 'Thank you for your submission!';
        descEl.textContent = eventName
          ? 'Your artwork has been submitted for ' + eventName + '. Our jury will review all eligible entries and shortlisted artists will be contacted directly.'
          : 'Your artwork has been submitted. Our jury will review all eligible entries and shortlisted artists will be contacted directly.';
      } else if (eventName) {
        titleEl.textContent = 'Thank you for registering!';
        descEl.textContent = 'You’re registered for ' + eventName + '. We’ll be in touch with the details soon.';
      }
    })();
  </script>
</body>
</html>
